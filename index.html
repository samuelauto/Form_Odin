<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles/style.css">
    <title>Sign-Up Form</title>
</head>
<body>
    
    <div class="background-image">
        <img src="./img/halie-west-25xggax4bSA-unsplash.jpg" class="image_background">

        <div class="logo-odin">
            <div class="image-odin">
                <img src="./img/odin-lined.png" height="100px">
            </div>
            <div class="text-odin">
                <p>ODIN</p>
            </div>
        </div>

    </div>
        
    <div class="content">
        <div class="text-up">
            <p>This is not a real online service!You know you need something<br> like this 
               in your life to help you realize your deepest dreams.<br>
               Sign up  <em>now</em> to get started.<br><br>
               You <em>know</em> you want to.
            </p>
            <br>

        </div>
        
        <div class="form-section">
            <form action="#" method="post">
                <h3>Let's do this!</h3>

                <div class="first-row">
                    <div>
                        <label for="first-name" > First Name</label>
                        <br>
                        <input type="text" id="first-name" name="first-name">
                    </div>
                    <div>
                        <label for="last-name"> Last Name</label>
                        <br>
                        <input type="text" id="last-name" name="last-name">
                    </div>
                </div>

                <div class="second-row">
                    <div>
                        <label for="email"> Email </label>
                        <br>
                        <input type="email" id="email" name="email" placeholder="you@example.com" title="Necesita una direccion de correo valida" required>
                    </div>
                    <div>
                        <label for="phone-number">Phone Number</label>
                        <br>
                        <input type="tel" id="phone-number" name="phone_number" pattern="[0-9]{10}" title="Debe contener al menos 10 digitos">
                    </div>
                </div>

                <div class="third-row">
                    <div>
                        <label for="password"> Password </label>
                        <br>
                        <input type="password" id="password" required>
                    </div>
                    <div>
                        <label for="password-confirm"> Confirm Password </label>
                        <br>
                        <input type="password" id="password-confirm" required>
                    </div>
                </div>
                

            </form>
        </div>

        <div class="text-down">
            <p>Seccion de envio del formulario</p>
        </div>
        
    </div>



</body>
